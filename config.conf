; config.conf
; 思维导图外观配置文件
; 你可以在这里自定义颜色、背景和 Logo。
; 如果不想设置某一项，可以将其留空或在行首添加 ; 注释掉。

[Background]
; 背景颜色，可以是颜色名 (如 white) 或十六进制值 (如 #f4f7f9)
color = #f4f7f9

; 背景图片 URL，可以是相对于本配置文件的本地路径 (如 assets/bg.jpg) 或网络链接。
; 本地文件会自动复制到输出目录的 images/；设置后会覆盖背景颜色。
image_url = 

; 背景图片样式 (当 image_url 生效时)：
; image_size: cover (铺满), contain (完整显示), auto
image_size = cover
image_repeat = no-repeat


[Logo]
; Logo 图片 URL，可以是相对于本配置文件的本地路径 (如 assets/logo.png) 或网络链接。
; 本地文件会自动复制到输出目录的 images/。
image_url = 

; Logo 位置: top-left, top-right, bottom-left, bottom-right
position = top-left

; Logo 缩放比例 (1 = 100% 原始尺寸, 0.5 = 50%, 1.2 = 120%)
scale = 0.35

; Logo 外边距，用于控制与边缘的距离
margin = 20px

; Logo 透明度 (0.0 到 1.0)
opacity = 0.8


[Cover]
; 是否在生成的 HTML 中包含封面。关闭后，双击主页键不会显示封面。
enabled = true

; 非交互生成时的默认值；交互生成会以它作为 Y/n 的默认选项。
show_on_open = true

; 留空时自动使用 Markdown 的第一个标题。
title =
; 可显式设置副标题；留空且标题含冒号时，会自动拆分为主标题和副标题。
subtitle =
auto_split_title = true

; 汇报信息；留空的行不会显示。
presenter =
presenter_label =
organization =
date =

; 封面背景支持相对于本配置文件的本地图片或网络 URL。
; 默认使用项目内置 SVG，可替换为其他本地图片或网络 URL。
background_image = assets/cover-default.svg
background_overlay = rgba(8, 26, 58, 0.42)
text_color = #ffffff
accent_color = #8ed7ff

; 四角 Logo 均为可选项，本地图片会自动打包到 images/。
logo_top_left =
logo_top_right =
logo_bottom_left =
logo_bottom_right =
logo_size = 96px
logo_margin = 32px


[Nodes]
; 连接线的颜色
connector_color = #a2b9d6

; --- 根节点 (第 0 级) ---
root_bg_color = #4a90e2
root_text_color = white
root_border_color = #357abd

; --- 第 1 级节点 ---
level1_bg_color = #e8f0fe
level1_text_color = #333333
level1_border_color = #a2b9d6

; --- 第 2 级节点 ---
level2_bg_color = #e2e8f0
level2_text_color = #333333
level2_border_color = #b8c6d9

; --- 第 3 级及更深层级节点 ---
level3_bg_color = #f8f9fa
level3_text_color = #333333
level3_border_color = #e0e0e0
